version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: petroax-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: petroax
      POSTGRES_USER: petroax
      POSTGRES_PASSWORD: petroax_dev_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petroax -d petroax"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
